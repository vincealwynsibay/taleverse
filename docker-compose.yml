services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taleverse
      POSTGRES_PASSWORD: taleverse
      POSTGRES_DB: taleverse
    ports:
      - "5432:5432"
    volumes:
      - taleverse-db:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taleverse"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  taleverse-db:
